<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect width="180" height="180" rx="42" fill="url(#bg)"/>
  <rect width="180" height="80" rx="42" fill="url(#gloss)"/>

  <!-- Nose point -->
  <polygon points="90,18 78,40 102,40" fill="white"/>
  <!-- Fuselage -->
  <ellipse cx="90" cy="92" rx="14" ry="55" fill="white"/>
  <!-- Main wings -->
  <ellipse cx="90" cy="88" rx="76" ry="20" fill="white"/>
  <!-- Tail stabilisers -->
  <ellipse cx="90" cy="138" rx="38" ry="12" fill="white"/>
</svg>
